name: CI

# Build, check formatting, and run the fast (unit) tests on every push and PR. The solution has
# net10.0-windows projects (the live-app host, the tray), so this must run on Windows. The integration
# suite loads real solutions and drives design-time builds, real debugger sessions, and -- for the XAML
# and UWP tests -- toolchains that are not present on a hosted runner (those tests skip themselves), so
# it stays the local pre-commit gate rather than a CI job for now.
on:
  push:
  pull_request:

# A second push to a branch makes the first run's answer worthless before it finishes. Main is the
# exception: that history is what tells you which commit broke the build, so it is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here writes to the repository. The repository is public, so a fork's pull request runs this
# workflow, and stating the permission beats inheriting whatever the repository default becomes.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    # Without this a hung WinUI build holds the runner for six hours before GitHub gives up.
    timeout-minutes: 20
    steps:
      # MinVer reads the version off the nearest git tag, and checkout fetches one commit
      # with no tags by default -- which would silently version every build 0.0.0-alpha.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # setup-dotnet's own cache wants a packages.lock.json, which this repository does not use.
      # Central package management puts every direct version in one file, so hashing that is close
      # enough: a version bump misses the cache and everything else hits it. Worth having because
      # Roslyn and the Windows App SDK are most of what a cold restore downloads.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RoseMcp.slnx

      - name: Build
        run: dotnet build RoseMcp.slnx --configuration Debug --no-restore

      - name: Check formatting
        run: dotnet format RoseMcp.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: dotnet test tests/RoseMcp.UnitTests/RoseMcp.UnitTests.csproj --configuration Debug --no-build

  integration-tests:
    # A job of its own rather than more steps on build-and-test, so formatting and the unit tests
    # still answer in about three minutes while this runs beside them. It pays for a second restore
    # and build to get that, which is the trade being made deliberately.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build RoseMcp.slnx --configuration Release

      # The test executable directly, not dotnet test: xunit's own -class- filter is not something
      # Microsoft.Testing.Platform forwards, and `dotnet test -- -class- ...` selects nothing at all.
      #
      # LiveAppSessionTests is excluded by name rather than left to skip itself. It needs classic-UWP
      # tooling, a C++ toolset and developer mode; a hosted runner has none of those, and 16 tests
      # reporting "skipped" in a green run reads as coverage that is not there. Excluding them says
      # what this job checks. They stay a local gate, where the toolchain exists and they all run.
      - name: Integration tests
        run: ./tests/RoseMcp.IntegrationTests/bin/Release/net10.0/RoseMcp.IntegrationTests.exe -class- '*LiveAppSessionTests'
