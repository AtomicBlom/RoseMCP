name: CI

# Build, check formatting, and run the tests on every pull request and on main. The solution has
# net10.0-windows projects (the live-app host, the tray), so this must run on Windows.
#
# The integration suite is split from the unit one by what it needs rather than by what it is, and
# the live-app half is split again on the same principle: a test that drives a real debugger session
# against a plain .NET child process runs in the integration job, and one that needs a XAML probe app
# -- a C++ toolset, the Windows App SDK, developer mode, a machine-wide registration -- runs in a job
# of its own that sets those up first. Everything else needs only the .NET SDK, and that is most of
# the suite, and the only guard on most of the invariants in CLAUDE.md.
#
# Neither integration job lets a test skip. Both set ROSEMCP_TESTS_REQUIRE_TOOLCHAIN, which turns
# every skip in the suite -- a missing toolset, an app that never came up -- into a failure naming
# what was missing, because a skip reads as a pass and a runner that quietly lost a component would
# otherwise look exactly like one that ran everything. Unset, as on a developer machine, a missing
# toolchain still skips.
#
# The native XAML providers get a job of their own, because they are the one part of this repository
# the solution build never touches: both taps can be broken with `dotnet build` green, and nothing
# else here would notice.
#
# Those three are also the slow ones, so a pull request runs each only when something it could catch
# has changed, and builds the providers as x64 Debug only. Main, and a manual run, get everything.
on:
  # Only main. A branch with a pull request open would otherwise run this twice for one
  # change -- once for the push and once for the pull request -- which doubles the wait and
  # halves the attention anybody pays to the result.
  push:
    branches: [main]
  pull_request:
  # The full run on demand, for a branch whose change the path rules below judge too narrowly.
  workflow_dispatch:

# A second push to a branch makes the first run's answer worthless before it finishes. Main is the
# exception: that history is what tells you which commit broke the build, so it is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nothing here writes to the repository. The repository is public, so a fork's pull request runs this
# workflow, and stating the permission beats inheriting whatever the repository default becomes.
permissions:
  contents: read

jobs:
  # Decides which of the slow jobs a pull request needs. Done with a job and `if:` rather than with
  # `paths:` on the trigger, because the jobs here are required checks: a workflow filtered out by
  # `paths:` reports nothing, and a required check that never reports holds the pull request open
  # forever, while a job skipped by `if:` reports as skipped, which the ruleset accepts.
  #
  # The rules lean opposite ways on purpose. The providers read nothing outside their own folders
  # except the WindowsAppSDK version, so they run when one of those inputs is touched. The integration
  # suite reaches nearly everything, so it runs unless every changed file is somewhere it cannot see:
  # a new project or a new top-level folder then runs the suite by default instead of slipping past it.
  # The probe-app tests lean the providers' way, because they are the slowest job here and reach a
  # known corner of the tree: the broker's live-app path, the live-app host and what it loads, both
  # taps, the probe apps, and the tests themselves.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
      providers: ${{ steps.filter.outputs.providers }}
      probes: ${{ steps.filter.outputs.probes }}
    steps:
      # Two commits, because a pull_request run checks out the merge commit, whose first parent is
      # the base branch as it is now: diffing the two is exactly what merging would change.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the changed files
        id: filter
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo 'integration=true' >> "$GITHUB_OUTPUT"
            echo 'providers=true' >> "$GITHUB_OUTPUT"
            echo 'probes=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"

          # The shared headers, both taps, and projections.csproj's restore inputs.
          providers='^(src/RoseMcp\.Xaml(\.Uwp|\.WinUi)?\.Tap/|Directory\.(Build|Packages)\.props$|global\.json$|\.github/workflows/ci\.yml$)'
          # Nothing the integration job builds or runs reads these. The taps are here because the
          # tests that load a provider are the ProbeApp category, which that job excludes.
          unseen='^(docs/|wiki/|tools/|\.claude/|src/RoseMcp\.Xaml(\.Uwp|\.WinUi)?\.Tap/|\.github/workflows/release\.yml$|[^/]+\.md$)'
          # What a probe-app test reaches: the broker and the projects it references, the live-app
          # host and the projects it loads, both taps and their shared headers, the probe apps, the
          # test project and its shared doubles, and the build inputs every one of them reads.
          # ProbeAppCategoryTests holds this against the test project's reference graph, so a new
          # reference fails there until it is added here or named as one no probe-app test reaches.
          probes='^(src/RoseMcp\.(Broker|Contracts|Logging|Settings|Solutions|LiveApp|Symbols|XamlDiff)/|src/RoseMcp\.Xaml(\.Uwp|\.WinUi)?\.Tap/|tests/apps/|tests/RoseMcp\.(IntegrationTests|TestSupport)/|Directory\.(Build|Packages)\.props$|global\.json$|\.github/workflows/ci\.yml$)'

          if grep -Eq "$providers" <<< "$changed"; then p=true; else p=false; fi
          if grep -Evq "$unseen" <<< "$changed"; then i=true; else i=false; fi
          if grep -Eq "$probes" <<< "$changed"; then a=true; else a=false; fi

          echo "integration=$i" >> "$GITHUB_OUTPUT"
          echo "providers=$p" >> "$GITHUB_OUTPUT"
          echo "probes=$a" >> "$GITHUB_OUTPUT"
          echo "integration: $i, providers: $p, probes: $a"

  build-and-test:
    runs-on: windows-latest
    # Without this a hung WinUI build holds the runner for six hours before GitHub gives up.
    timeout-minutes: 20
    steps:
      # MinVer reads the version off the nearest git tag, and checkout fetches one commit
      # with no tags by default -- which would silently version every build 0.0.0-alpha.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # setup-dotnet's own cache wants a packages.lock.json, which this repository does not use.
      # Central package management puts every direct version in one file, so hashing that is close
      # enough: a version bump misses the cache and everything else hits it. Worth having because
      # Roslyn and the Windows App SDK are most of what a cold restore downloads.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RoseMcp.slnx

      - name: Build
        run: dotnet build RoseMcp.slnx --configuration Debug --no-restore

      - name: Check formatting
        run: dotnet format RoseMcp.slnx --verify-no-changes --no-restore

      # The comment conventions, which are the one rule in CLAUDE.md that binds every file and had
      # nothing checking it. A baseline per file, so the existing debt does not have to be paid to
      # get the guard, and cannot grow while it goes unpaid.
      - name: Check comment conventions
        shell: pwsh
        run: ./tools/Check-Comments.ps1

      - name: Unit tests
        run: dotnet test tests/RoseMcp.UnitTests/RoseMcp.UnitTests.csproj --configuration Debug --no-build

  # The integration tests that need only the .NET SDK. Its own job rather than a step in the one
  # above, so it runs alongside the unit tests instead of after them; the second build is the price.
  #
  # The probe-app tests are excluded, and nothing else is. They want a C++ toolset, the Windows App
  # SDK, developer mode and a machine-wide package registration, which the probe-apps job below sets
  # up and this one does not, so they run there instead.
  #
  # The debugger half runs here: it drives DebugProbeTarget, an ordinary .NET child process, and a
  # hosted runner serves a real ICorDebug session against one without complaint, which the eleven
  # tests in LiveAppInspectionTests demonstrate on every run. ProbeAppCategoryTests decides which
  # half a class is in from the fixture its constructor takes, so the category is not something to
  # remember, and a count of what it excludes is not something to keep up to date here.
  #
  # Expect this to be slow rather than merely long: #39 records that these tests share no workspace
  # fixtures, so the solution loads contend for a runner with four cores where the developer box has
  # twelve. The timeout is the cap, not the target, and it allows for the bounded parallelism below
  # trading wall time for finishing at all.
  integration:
    needs: changes
    # `!= 'false'` rather than `== 'true'`, so a changes job that failed and set nothing runs the
    # suite. A skipped required check passes, and a broken filter must not be a way to pass it.
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: windows-latest
    # The probe-free step's own limit plus ten minutes for the rest of the job around it -- setup,
    # the build, the Windows half and an evidence upload, about three minutes together -- so a step
    # that times out still leaves the job the time to keep what it found.
    timeout-minutes: 45
    # Every skip a failure: this runner is set up for everything the tests it runs need, so a skip
    # here is a gap in that setup rather than a limit of the machine (MachineLimit in the tests).
    env:
      ROSEMCP_TESTS_REQUIRE_TOOLCHAIN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A hosted runner carries no x86 runtime, and one test needs one: Attaches_to_an_x86_target
      # builds an x86 debug host and an x86 target, both framework-dependent, so without it the
      # target exits before anything can attach, which this job's switch makes a failure rather than
      # the skip it is on a developer machine. x86 is not a legacy case here: it is the default
      # platform of the modern UWP template, so it is what an ordinary new app is built as.
      #
      # DOTNET_ROOT_X86 rather than installing where the official x86 installer would, because it is
      # documented as the first thing an x86 apphost consults, it needs no administrator, and it does
      # not rest on a guess about the default probe path. Nothing but an x86 apphost reads it, so the
      # x64 toolchain this job otherwise runs on is untouched.
      - name: Install the x86 .NET runtime
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'

          Invoke-WebRequest -UseBasicParsing 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer
          & $installer -Architecture x86 -Runtime dotnet -Channel 10.0 -InstallDir $installDir

          # Asserted rather than assumed: an install that quietly produced nothing would surface as an
          # x86 attach test failing several minutes later, for a reason that has nothing to do with
          # what it tests. Running it is the check, because a dotnet.exe of the wrong architecture is
          # on disk exactly like a right one.
          $x86Dotnet = Join-Path $installDir 'dotnet.exe'
          if (-not (Test-Path $x86Dotnet)) { throw "No dotnet.exe under $installDir after the install." }

          & $x86Dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0) { throw "The x86 runtime in $installDir does not run." }

          "DOTNET_ROOT_X86=$installDir" >> $env:GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RoseMcp.slnx

      - name: Build
        run: dotnet build RoseMcp.slnx --configuration Debug --no-restore

      # Excluded by category, not by class name, because that is the exclusion TUnit supports: a tree
      # filter negates a property with [Category!=...], while negating a path segment matches nothing
      # at all. Which classes carry the category is asserted rather than counted here: a count in a
      # comment is stale the next time a class is split, and ProbeAppCategoryTests fails instead.
      # Parallelism is bounded rather than left to TUnit's auto-detected optimum, which counts tests
      # and not the processes they start. Sampling BrokerTests alone on a developer box found 28
      # concurrent RoseMcp.Worker processes for 27 tests, each running a real design-time build; the
      # same filter under this limit peaks at 7. On four cores the unbounded version starves the
      # workers' own MCP handshake, which gets 60 seconds and fails the call rather than waiting, so
      # a run dies with TimeoutException: Initialization timed out on whichever tests happened to
      # start a worker during the spike -- a different set each run, which is what makes it read as
      # flakiness rather than as load. Three and not four, because one test can hold several workers.
      #
      # Every test is printed as it finishes, with its time, and the slowest are ranked at the end, so
      # a run that grows says where it grew. A finished test is all the runner prints, though, so the
      # suite's RunningTests names on stderr the tests still unfinished when a run is cut short.
      #
      # Bounded below the job's own limit, so a suite that hangs fails this step and leaves the job
      # the time to keep its evidence, rather than being cancelled with nothing uploaded. The runner's
      # own --timeout sits three minutes inside the step's, so the run normally ends itself -- naming
      # what it was running and writing its report into TestResults -- before the step is killed.
      #
      # A hang inside one test is bounded sooner, by the ten-minute ceiling each test has (TestDeadline),
      # and fails that test by name. What these limits are for is the whole run, and the step's is
      # scaled from a runner rather than from a developer box. Timed locally, three at a time, where the
      # wall time is a third of the test time, the suite takes 2581 s of test time; a subset of it
      # taking 2058 s took 19 minutes on a runner, so the whole is about 24 minutes there. 35 leaves
      # about half as much again, for a slow runner and for the tests still to come.
      - name: Integration tests, excluding the ones that need a probe app
        timeout-minutes: 35
        run: >-
          ./tests/RoseMcp.IntegrationTests/bin/Debug/net10.0/RoseMcp.IntegrationTests.exe
          --maximum-parallel-tests 3
          --treenode-filter '/*/*/*/*[Category!=ProbeApp]'
          --output Detailed
          --show-slowest-tests 20
          --timeout 32m

      # The Windows-only half, which is its own project because it takes a compile reference on
      # RoseMcp.LiveApp (net10.0-windows). Keeping that out of the project above is what leaves the
      # door open to running the rest off Windows.
      #
      # Run whatever the step above did. Skipped after a failure there, a break in this half is
      # invisible until the other is fixed, and one failure is read as the only one.
      - name: Integration tests that need Windows
        if: ${{ !cancelled() }}
        run: ./tests/RoseMcp.IntegrationTests.Windows/bin/Debug/net10.0-windows/RoseMcp.IntegrationTests.Windows.exe

      # A failed or cancelled run keeps its evidence. Every Rose process the suite starts logs into
      # its own directory under TestResults, which nothing prunes during the run, and a failing test
      # lists and attaches the logs written while it ran (FailureEvidence). On a hosted runner all of
      # it goes with the runner unless it is uploaded, and a failure seen only under load is exactly
      # the one that cannot be reproduced afterwards to find out.
      - name: Keep the evidence of a failed run
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence
          path: |
            tests/RoseMcp.IntegrationTests/bin/Debug/net10.0/TestResults/
            tests/RoseMcp.IntegrationTests.Windows/bin/Debug/net10.0-windows/TestResults/
          retention-days: 14
          if-no-files-found: ignore

  # The integration tests that need a XAML probe app: the tap injected into a running app, the
  # visual tree, the properties read, the pick, the overlay and the live-edit apply, against the
  # classic UWP, modern UWP and WinUI 3 probes. Everything the integration job leaves out by category.
  #
  # Its own job because it needs a machine the others do not: developer mode, Visual Studio's MSBuild
  # with the UWP tooling, the C++ toolset and the Windows SDK, and the Windows App Runtime. Each is set
  # up by a step of its own that checks its result and says what it found, so a failure here names
  # the component rather than surfacing as a test that could not start. The suite takes one machine
  # to itself -- the probe packages are registered machine-wide under fixed names -- and a hosted job
  # is a machine of its own, so this runs alongside the integration job rather than after it.
  #
  # A hosted runner rather than a self-hosted one. Nothing here needs more than a hosted image can be
  # given, and a self-hosted runner is a machine somebody keeps up for a public repository's pull
  # requests. What is least certain is the launch itself: a UWP or packaged WinUI app is activated
  # into an AppContainer in the runner's own session, and if the hosted image cannot do that, the
  # fallback is a self-hosted runner -- the developer box that runs this suite already -- with
  # `runs-on` pointed at its label. See docs/decisions/the-probe-app-tests-run-on-a-hosted-runner.md.
  probe-apps:
    needs: changes
    # The same fail-open condition as the integration job, for the same reason.
    if: ${{ !cancelled() && needs.changes.outputs.probes != 'false' }}
    runs-on: windows-latest
    # The test step's own limit plus the setup around it: a Visual Studio modify when the image lacks
    # a component is the long pole, at up to fifteen minutes, then the build and the two providers.
    timeout-minutes: 60
    # Every skip a failure. Each component a probe-app test can skip for is set up by a step below,
    # so a skip here is that step not having done what it said.
    env:
      ROSEMCP_TESTS_REQUIRE_TOOLCHAIN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Registering a loose AppX layout, which is how every probe is installed, needs developer mode.
      # Set the way the Settings page sets it, then read back, because a write that did not take is
      # otherwise reported by Add-AppxPackage several minutes later as a deployment error that does
      # not mention developer mode at all.
      - name: Turn on developer mode
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }

          $before = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowAllTrustedApps -PropertyType DWord -Value 1 -Force | Out-Null

          $after = (Get-ItemProperty -Path $key).AllowDevelopmentWithoutDevLicense
          if ($after -ne 1) { throw "Developer mode did not take: AllowDevelopmentWithoutDevLicense reads '$after' after being set to 1." }
          Write-Host "Developer mode is on (AllowDevelopmentWithoutDevLicense was '$before', is now $after)."

      # What the probes and the taps need from Visual Studio and the Windows SDK, checked as the files
      # the tests and build.ps1 look for rather than as component IDs, because the IDs differ between
      # products and change between releases while the files are what a build actually opens. The
      # instance is the one the tests and build.ps1 pick, the latest of any product. Only what is
      # missing is installed, so an image that already has everything costs a few seconds here.
      - name: Make sure Visual Studio can build the probe apps and the taps
        shell: pwsh
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "No vswhere.exe at $vswhere, so no Visual Studio to build the probe apps or the taps with." }

          $vs = & $vswhere -latest -products * -property installationPath
          $product = & $vswhere -latest -products * -property productId
          if (-not $vs) { throw 'No Visual Studio installation on this runner.' }
          Write-Host "Visual Studio: $product at $vs"

          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          function Find-Missing
          {
              $missing = @()
              if (-not (Test-Path "$vs\MSBuild\Current\Bin\MSBuild.exe")) { $missing += 'MSBuild, which builds both UWP probes' }
              if (-not (Test-Path "$vs\MSBuild\Microsoft\WindowsXaml")) { $missing += 'the UWP build targets (MSBuild\Microsoft\WindowsXaml), which the classic UWP probe imports' }
              if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction SilentlyContinue)) { $missing += 'the x64 MSVC toolset, which builds both taps' }
              if (-not (Test-Path "$kits\Platforms\UAP\10.0.26100.0")) { $missing += 'the Windows SDK 10.0.26100 UAP platform, which the classic UWP probe targets' }
              if (-not (Get-ChildItem "$kits\bin\*\XamlCompiler\Microsoft.Windows.UI.Xaml.Build.Tasks.dll" -ErrorAction SilentlyContinue)) { $missing += "the Windows SDK's UWP XAML compiler, which the modern UWP probe needs" }
              , $missing
          }

          $missing = Find-Missing
          if (-not $missing)
          {
              Write-Host 'Everything the probe apps and the taps need is already installed.'
              exit 0
          }

          Write-Host "Missing before setup:`n  $($missing -join "`n  ")"

          # Build Tools names the UWP tooling differently from the IDE products.
          $components = if ($product -eq 'Microsoft.VisualStudio.Product.BuildTools')
          {
              'Microsoft.VisualStudio.Workload.UniversalBuildTools', 'Microsoft.VisualStudio.ComponentGroup.UWP.BuildTools'
          }
          else
          {
              'Microsoft.VisualStudio.Workload.Universal', 'Microsoft.VisualStudio.ComponentGroup.UWP.Support'
          }
          $components += 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', 'Microsoft.VisualStudio.Component.Windows11SDK.26100'
          Write-Host "Adding: $($components -join ', ')"

          $arguments = @('modify', '--installPath', "`"$vs`"", '--quiet', '--norestart', '--nocache')
          foreach ($component in $components) { $arguments += '--add', $component }
          $process = Start-Process -FilePath "$installerDir\vs_installer.exe" -Wait -PassThru -ArgumentList $arguments

          if ($process.ExitCode -notin 0, 3010)
          {
              # The installer writes its reasons to dd_*.log under TEMP rather than to the console.
              $log = Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
              if ($log) { Write-Host "::group::$($log.Name)"; Get-Content $log.FullName -Tail 60; Write-Host '::endgroup::' }
              throw "vs_installer exited $($process.ExitCode) adding $($components -join ', ')."
          }

          $missing = Find-Missing
          if ($missing) { throw "Still missing after vs_installer added $($components -join ', '):`n  $($missing -join "`n  ")" }
          Write-Host 'Everything the probe apps and the taps need is installed now.'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RoseMcp.slnx

      - name: Build
        run: dotnet build RoseMcp.slnx --configuration Debug --no-restore

      # The WinUI probe is framework-dependent on the Windows App Runtime, which a hosted image does
      # not carry: the packaged shape cannot register without its framework package, and the
      # unpackaged one finds the runtime through the dynamic dependency packages. The runtime's MSIX
      # packages ship inside the Microsoft.WindowsAppSDK.Runtime package the probe restores, so the
      # version installed is the one the probe was built against rather than whatever an installer
      # URL serves today. Both shapes are restored here so the assets name it.
      - name: Install the Windows App Runtime the WinUI probe uses
        shell: pwsh
        run: |
          $project = 'tests/apps/winui/Rose.ProbeApp.WinUi.csproj'
          foreach ($shape in @(), @('-p:ProbePackaged=true'))
          {
              dotnet restore $project -r win-x64 @shape
              if ($LASTEXITCODE -ne 0) { throw "Restoring the WinUI probe ($($shape -join ' ')) failed with exit $LASTEXITCODE; the Windows App SDK could not be fetched." }
          }

          $assets = Get-Content 'tests/apps/winui/obj/project.assets.json' -Raw | ConvertFrom-Json
          $library = $assets.libraries.PSObject.Properties.Name | Where-Object { $_ -like 'Microsoft.WindowsAppSDK.Runtime/*' } | Select-Object -First 1
          if (-not $library) { throw 'The WinUI probe restored no Microsoft.WindowsAppSDK.Runtime package, so there is no Windows App Runtime to install.' }

          $packageRoot = $assets.packageFolders.PSObject.Properties.Name | Select-Object -First 1
          $msixDir = Join-Path $packageRoot ($assets.libraries.$library.path) | Join-Path -ChildPath 'tools\MSIX\win10-x64'
          if (-not (Test-Path $msixDir)) { throw "No x64 MSIX packages at $msixDir in $library." }
          Write-Host "Installing the Windows App Runtime from $library ($msixDir)"

          # What each package is, read out of its own manifest, so the check below asks for exactly
          # these packages: a runner carrying some other Windows App Runtime cannot pass for one
          # carrying this one, and a dynamic dependency package that failed to install is named
          # rather than surfacing as an unpackaged probe that never opens a window.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Read-Identity($msix)
          {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
              try
              {
                  $reader = [System.IO.StreamReader]::new($zip.GetEntry('AppxManifest.xml').Open())
                  try { ([xml]$reader.ReadToEnd()).Package.Identity }
                  finally { $reader.Dispose() }
              }
              finally { $zip.Dispose() }
          }

          # The framework first, since the others depend on it.
          $packages = Get-ChildItem $msixDir -Filter '*.msix' | Sort-Object { $_.BaseName -notmatch '^Microsoft\.WindowsAppRuntime\.\d+$' }, Name
          if (-not $packages) { throw "No .msix files in $msixDir." }

          $failed = @()
          foreach ($msix in $packages)
          {
              try
              {
                  Add-AppxPackage -Path $msix.FullName -ErrorAction Stop
                  Write-Host "  installed $($msix.Name)"
              }
              catch
              {
                  # 0x80073D06 is "a higher version is already installed", which leaves the machine
                  # with what the probe needs; the check below confirms it. Anything else is a failure.
                  $hresult = '{0:X8}' -f $_.Exception.HResult
                  $newerInstalled = $hresult -eq '80073D06' -or $_.Exception.Message -match '0x80073D06'
                  if ($newerInstalled) { Write-Host "  $($msix.Name): a higher version is already installed" }
                  else { $failed += "$($msix.Name) did not install: $($_.Exception.Message)" }
              }
          }

          foreach ($msix in $packages)
          {
              $identity = Read-Identity $msix
              $wanted = [version]$identity.Version
              # The dynamic dependency package carries its version in its name as well
              # (Microsoft.WinAppRuntime.DDLM.2.4.0.0-x6), so a newer one is a different name. The
              # bootstrapper takes any at the version or later, so the check does too.
              $name = $identity.Name.Replace($identity.Version, '*')
              $present = Get-AppxPackage -Name $name |
                  Where-Object { "$($_.Architecture)" -eq "$($identity.ProcessorArchitecture)" -and [version]$_.Version -ge $wanted } |
                  Sort-Object { [version]$_.Version } -Descending | Select-Object -First 1

              if ($present) { Write-Host "  present: $($present.Name) $($present.Version) ($($identity.ProcessorArchitecture)), wanted $wanted or later" }
              else
              {
                  Write-Host "  missing: $name $wanted or later ($($identity.ProcessorArchitecture)), from $($msix.Name)"
                  $failed += "$name $wanted or later for $($identity.ProcessorArchitecture) is not registered"
              }
          }

          if ($failed) { throw ("The Windows App Runtime from $msixDir is not fully installed:`n  " + ($failed -join "`n  ")) }

      # The fixtures build both taps themselves, once a run, and skip on build.ps1's exit 3 -- which
      # this job's switch turns into a failure without the build's output. Building them here first
      # puts a missing toolset or a compile error in a step of its own, with the compiler's words.
      - name: Build the taps the probe apps load
        shell: pwsh
        run: |
          $failed = @()
          foreach ($project in 'RoseMcp.Xaml.Uwp.Tap', 'RoseMcp.Xaml.WinUi.Tap')
          {
              Write-Host "::group::$project (x64 Debug)"
              & ./src/$project/build.ps1 -Platform x64 -Configuration Debug
              $code = $LASTEXITCODE
              Write-Host '::endgroup::'

              if ($code -eq 3) { $failed += "$project exited 3: this runner has no toolset or SDK for it, which the step above should have installed" }
              elseif ($code -ne 0) { $failed += "$project exited $code" }
          }

          if ($failed) { throw ("taps failed to build:`n  " + ($failed -join "`n  ")) }

      # Selected by the category the integration job excludes, so the two jobs together run the whole
      # suite and ProbeAppCategoryTests holds the two filters to each other.
      #
      # Parallelism bounded as in the integration job. The three probes run alongside each other by
      # design, each serialised on its own constraint key, so three is also as many as can usefully
      # run at once.
      #
      # The runner's --timeout three minutes inside the step's, for the same reason as there: the run
      # ends itself, naming what was still running, before the step is killed. On a twelve-core
      # developer box this half takes four minutes, the first build of all three probe apps and both
      # taps included; 27 allows a four-core runner to be six times slower than that and still finish.
      - name: Integration tests that need a probe app
        timeout-minutes: 30
        run: >-
          ./tests/RoseMcp.IntegrationTests/bin/Debug/net10.0/RoseMcp.IntegrationTests.exe
          --maximum-parallel-tests 3
          --treenode-filter '/*/*/*/*[Category=ProbeApp]'
          --output Detailed
          --show-slowest-tests 20
          --timeout 27m

      # The same evidence as the integration job keeps, under a name of its own so a run where both
      # fail keeps both. The tap's own logs are in it too: every process the suite starts, the apps'
      # injected providers included, logs under TestResults.
      - name: Keep the evidence of a failed run
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: probe-app-evidence
          path: |
            tests/RoseMcp.IntegrationTests/bin/Debug/net10.0/TestResults/
          retention-days: 14
          if-no-files-found: ignore

  # The native XAML providers, for every architecture a shipped install can carry.
  #
  # Its own job because nothing else here compiles a line of the C++: the taps are built by their own
  # build.ps1 rather than by the solution, so `dotnet build` is green with both of them broken. Before
  # this, the first thing to notice was the release job failing to package -- which is the worst place
  # to find out, since it is after the tag is cut and the fix means cutting another.
  #
  # A missing toolset is exit 3 from build.ps1's own Fail, which lets a developer machine skip with a
  # warning. Here every non-zero exit is a failure, which is the whole point of the job: an agent that
  # cannot build the ARM64 provider must say so rather than quietly produce an install that has no
  # XAML inspection for half the targets it claims to serve.
  #
  # A pull request builds x64 Debug only, which answers the question a pull request is asking: does
  # the C++ still compile and link. Installing the ARM64 cross-toolset is an installer run of several
  # minutes, longer than all six compiles, and every architecture and configuration compiles the same
  # headers. What is left uncaught -- a break only x86 or ARM64 sees, such as x86's decorated export
  # names, or one only the optimiser trips -- is rare, and main still builds all six as Release before
  # any release is cut from it.
  xaml-providers:
    needs: changes
    # The same fail-open condition as the integration job, for the same reason.
    if: ${{ !cancelled() && needs.changes.outputs.providers != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # x86 and x64 come with the C++ workload; ARM64 is a separate component. Added rather than
      # assumed, so it cannot vanish when windows-latest moves. This mirrors release.yml, which needs
      # the same toolset to package the win-arm64 artifact.
      - name: Install the MSVC ARM64 cross-toolset
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installerDir\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation on this runner' }

          $process = Start-Process -FilePath "$installerDir\vs_installer.exe" -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"", '--quiet', '--norestart', '--nocache',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64')

          if ($process.ExitCode -notin 0, 3010) { throw "vs_installer exited $($process.ExitCode)" }

      - name: Build every provider for every architecture
        shell: pwsh
        run: |
          $isPullRequest = $env:GITHUB_EVENT_NAME -eq 'pull_request'
          $platforms = if ($isPullRequest) { @('x64') } else { @('x86', 'x64', 'arm64') }
          $configuration = if ($isPullRequest) { 'Debug' } else { 'Release' }
          Write-Host "platforms: $($platforms -join ', '); configuration: $configuration"

          $failed = @()
          foreach ($project in 'RoseMcp.Xaml.Uwp.Tap', 'RoseMcp.Xaml.WinUi.Tap')
          {
              foreach ($platform in $platforms)
              {
                  Write-Host "::group::$project ($platform)"
                  & ./src/$project/build.ps1 -Platform $platform -Configuration $configuration
                  $code = $LASTEXITCODE
                  Write-Host '::endgroup::'

                  # 3 is "this machine has no toolset for it", which is a skip on a laptop and a
                  # failure here -- the runner is the machine that is supposed to have every toolset.
                  if ($code -ne 0) { $failed += "$project ($platform) exited $code" }
              }
          }

          # Every combination is attempted before failing, so one run names all of them rather than
          # stopping at the first and hiding the rest behind a re-run.
          if ($failed) { throw ("providers failed to build:`n  " + ($failed -join "`n  ")) }

  # The half of this repository that ships for Linux, built and tested there. Not the whole solution:
  # the tray is WinUI and the debug host is ICorDebug, so `dotnet build RoseMcp.slnx` cannot succeed
  # off Windows and never will. The unit test project references neither, which is what makes this
  # possible at all -- and #34's point is that shipping a linux artifact without ever running it is
  # the same trust nobody extends to the Windows half.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The two things a Linux user actually runs, published for the RIDs the release ships. This is
      # what proves the claim in #34 -- that nothing in the broker or worker graph reaches the
      # Windows-only projects -- rather than inferring it from the reference lists.
      - name: Publish the broker and worker
        run: |
          for rid in linux-x64 linux-arm64; do
            dotnet publish src/RoseMcp.Server -c Release -r $rid --self-contained false -o /tmp/$rid
            dotnet publish src/RoseMcp.Worker -c Release -r $rid --self-contained false -o /tmp/$rid
          done

      # The paths in these used to be literal C:\... , which is not a path here: with no leading
      # separator GetFullPath reads it as relative and GetFileName returns the whole string, so they
      # failed for reasons that had nothing to do with what they test.
      - name: Unit tests
        run: dotnet test tests/RoseMcp.UnitTests/RoseMcp.UnitTests.csproj -c Release
